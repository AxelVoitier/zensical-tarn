# Preparation only: no PyPI/TestPyPI upload and no release creation.
name: Release preparation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Proposed version tag to validate, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
  preflight:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Check proposed release without publishing
        env:
          TARN_PROPOSED_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py --strict --tag "$TARN_PROPOSED_TAG" --report release-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-report
          path: release-report.json
