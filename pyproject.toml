[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"

[project]
name = "zensical-tarn"
dynamic = ["version"]
description = "Tarn: a quiet, Diátaxis-aware documentation theme for Zensical"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.11"
authors = [{ name = "Axel Voitier" }]
keywords = ["zensical", "theme", "documentation", "diataxis", "mkdocs"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: MkDocs",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]
# Navigation partials are checked against this release. Widen after verification.
dependencies = ["zensical==0.0.73"]

[project.urls]
Homepage = "https://github.com/AxelVoitier/zensical-tarn"
Documentation = "https://axelvoitier.github.io/zensical-tarn/"
Issues = "https://github.com/AxelVoitier/zensical-tarn/issues"
Changelog = "https://github.com/AxelVoitier/zensical-tarn/blob/main/CHANGELOG.md"

# Zensical discovers installed themes through this entry point group.
# Users select the theme with  name = "tarn".
[project.entry-points."mkdocs.themes"]
tarn = "zensical_tarn"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+(?:(?:a|b|rc)\d+)?(?:\.post\d+)?)$'
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"

[tool.hatch.build]
reproducible = true

[tool.hatch.build.targets.wheel]
packages = ["src/zensical_tarn"]

[tool.hatch.build.targets.sdist]
include = ["src", "docs", "design", "screenshots", "scripts", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "LICENSES", "NOTICE", "RELEASING.md", "UPGRADING_ZENSICAL.md", "AGENTS.md", "pyrightconfig.json", "release-review.toml", "zensical.toml"]

# Pin the complete backend toolchain used by official release preparation.
# Ordinary isolated builds use build-system.requires; release builds use this
# group with --no-isolation so transitive backend versions cannot drift.
[dependency-groups]
release = [
  "build==1.6.1",
  "pyproject-hooks==1.3.3",
  "twine==7.0.0",
  "hatchling==1.32.4",
  "hatch-vcs==0.5.0",
  "setuptools-scm==10.3.4",
  "vcs-versioning==2.6.0",
  "setuptools==84.2.1",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
]

[tool.hatch.envs.doc.scripts]
serve = "zensical serve --open {args}"
example = "zensical serve -f examples/minimal-site/zensical.toml --open {args}"
build = "zensical build --strict --clean {args}"

[tool.hatch.envs.check]
detached = true

[tool.hatch.envs.check.scripts]
css = "python scripts/build_css.py --check"
generate-css = "python scripts/build_css.py"
unit = "python -m unittest discover -s tests -v"
all = ["css", "unit"]

[tool.hatch.envs.release]
detached = true
python = "3.12"
dependency-groups = ["release"]

[tool.hatch.envs.release.scripts]
check = "python scripts/check_release.py --strict --require-tag --report release-report.json {args}"
prepare = "python scripts/prepare_release.py {args}"
