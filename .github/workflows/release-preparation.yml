# Sole coordinator. Activation needs separately authorised setup and hosted proof.
# Registry publication remains hard-disabled; local controlled-path proof is separate.
name: Release preparation

on:
  create:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      mode:
        description: Resume retained originals, or repeat full preparation before originals exist
        type: choice
        options: [resume, prepare]
        default: resume
        required: true

permissions: {}

# Keep the same group through future approval and finalisation jobs.
# Overflow requires state inspection and a deliberate new request; no FIFO promise.
concurrency:
  group: tarn-release
  cancel-in-progress: false
  queue: max

env:
  RECORD_ID: ${{ vars.TARN_RELEASE_RECORD_ID }}
  RECORD_TARGET: ${{ vars.TARN_RELEASE_RECORD_TARGET }}
  REPOSITORY_ID: ${{ vars.TARN_RELEASE_REPOSITORY_ID }}

jobs:
  resolve:
    if: >-
      vars.TARN_RELEASE_PREPARATION_ENABLED == 'true' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'create' || github.event.ref_type == 'tag')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Authenticated draft reads and append-only private admission.
    outputs:
      action: ${{ steps.admission.outputs.action }}
      head: ${{ steps.admission.outputs.head }}
      tag-ref-target: ${{ steps.admission.outputs.tag-ref-target }}
      tag-ref-type: ${{ steps.admission.outputs.tag-ref-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Require the reviewed verifier runtime
        run: test "$(gh --version | head -n 1 | cut -d ' ' -f 3)" = '2.99.0'
      - name: Admit frozen tagged instructions against retained operational state
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -I scripts/release/coordinator.py admit --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID" --output "$RUNNER_TEMP/admission.json"

  prebuild:
    needs: resolve
    if: needs.resolve.outputs.action == 'prepare'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Draft read only here; no package execution.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Recheck admission before starting preparation
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_HEAD: ${{ needs.resolve.outputs.head }}
        run: >-
          python -I scripts/release/coordinator.py guard --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID" --head "$ADMISSION_HEAD"

  build:
    needs: [resolve, prebuild]
    if: needs.resolve.outputs.action == 'prepare'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag-ref-target: ${{ needs.resolve.outputs.tag-ref-target }}
      tag-ref-type: ${{ needs.resolve.outputs.tag-ref-type }}

  retain:
    needs: [resolve, build]
    if: needs.resolve.outputs.action == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      admission-head: ${{ steps.retained.outputs.admission-head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Require the reviewed verifier runtime
        run: test "$(gh --version | head -n 1 | cut -d ' ' -f 3)" = '2.99.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-artifact-id }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Create product recovery storage and verify durable read-back
        id: retained
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_HEAD: ${{ needs.resolve.outputs.head }}
          CANDIDATE_DIGEST: ${{ needs.build.outputs.candidate-digest }}
        run: >-
          python -I scripts/release/coordinator.py retain --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID" --head "$ADMISSION_HEAD"
          --candidate-dir "$RUNNER_TEMP/candidate" --candidate-digest "$CANDIDATE_DIGEST"

  resume:
    needs: resolve
    if: needs.resolve.outputs.action == 'resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Fetch private drafts in isolation, never execute package code.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Require the reviewed verifier runtime
        run: test "$(gh --version | head -n 1 | cut -d ' ' -f 3)" = '2.99.0'
      - name: Retrieve verified originals and original evidence without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          ADMISSION_HEAD: ${{ needs.resolve.outputs.head }}
        run: >-
          python -I scripts/release/coordinator.py recover --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID" --head "$ADMISSION_HEAD"
          --output "$RUNNER_TEMP/originals"
      # Later publication stages consume only these verified original files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovered-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/originals/
          if-no-files-found: error

  publish-testpypi:
    needs: [resolve, retain, resume]
    # Hard gate: no variable or dispatch input can enable registry writes in Stage B.
    # Normal/resumed publication is exercised through controlled local adapters.
    if: >-
      false && always() && needs.resolve.result == 'success' &&
      (needs.retain.result == 'success' || needs.resume.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testpypi
    outputs:
      retrieved-artifact-id: ${{ steps.publication.outputs.retrieved-artifact-id }}
      candidate-digest: ${{ steps.publication.outputs.candidate-digest }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Refuse hosted publication until registry adapters and identity proof are reviewed
        id: publication
        run: >-
          python -I scripts/release/coordinator.py testpypi --uploads-disabled --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID"

  verify-testpypi:
    needs: [resolve, publish-testpypi]
    if: >-
      needs.publish-testpypi.result == 'success' &&
      needs.publish-testpypi.outputs.retrieved-artifact-id != '' &&
      needs.publish-testpypi.outputs.candidate-digest != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.sha }}
      candidate-artifact-id: ${{ needs.publish-testpypi.outputs.retrieved-artifact-id }}
      candidate-digest: ${{ needs.publish-testpypi.outputs.candidate-digest }}
      tag-ref-target: ${{ needs.resolve.outputs.tag-ref-target }}
      tag-ref-type: ${{ needs.resolve.outputs.tag-ref-type }}
      retrieved-testpypi: true

  review:
    needs: [resolve, verify-testpypi]
    # No hosted receipt/approval adapter is enabled in local Stage B.
    if: false && needs.verify-testpypi.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Refuse hosted review until authenticated check and summary transport is reviewed
        run: >-
          python -I scripts/release/coordinator.py review --uploads-disabled --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID"

  publish-pypi:
    needs: [resolve, review]
    # Environment reviewers must be configured and proved under separate authority.
    # This declaration alone does not enforce explicit production approval.
    if: false && needs.review.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Refuse hosted publication until exact-summary approval transport is reviewed
        run: >-
          python -I scripts/release/coordinator.py publish-pypi --uploads-disabled --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID"

  finalise:
    needs: [resolve, publish-pypi]
    # No live release-write adapter or immutability proof exists in local Stage B.
    if: false && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Refuse hosted finalisation until approved-content transport and protections are proved
        run: >-
          python -I scripts/release/coordinator.py finalise --uploads-disabled --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID"

  report:
    needs: [resolve, prebuild, build, retain, resume, publish-testpypi, verify-testpypi, review, publish-pypi, finalise]
    if: always() && needs.resolve.outputs.head != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - name: Best-effort private result and original-tag recovery command
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
        run: >-
          python -I scripts/release/coordinator.py report --root .
          --admin-id "$RECORD_ID" --admin-target "$RECORD_TARGET"
          --repository-id "$REPOSITORY_ID" --outcome "$OUTCOME"
