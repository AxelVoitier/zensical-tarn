{#- Tarn: loads the theme stylesheet and prints the Diátaxis badge above each page title. -#}
{% extends "base.html" %}
{% import "partials/tarn.html" as tarn with context %}
{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ 'assets/stylesheets/tarn.css' | url }}">
{% endblock %}
{% block content %}
  {{ tarn.badge(page) }}
  {{ super() }}
{% endblock %}
