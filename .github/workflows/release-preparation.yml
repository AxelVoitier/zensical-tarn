# Preparation only: no PyPI/TestPyPI upload and no release creation.
name: Release preparation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Proposed version tag to validate, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
  preflight:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check proposed release without publishing
        env:
          TARN_PROPOSED_TAG: ${{ inputs.tag }}
        run: python scripts/check_release.py --strict --tag "$TARN_PROPOSED_TAG" --report release-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-report
          path: release-report.json
